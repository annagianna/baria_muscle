[workspace]
authors = ["annagianna <anna.giannakogeorgou@gmail.com>"]
channels = ["conda-forge","bioconda"]
name = "baria_muscle"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
datacleaning-clinical = "Rscript scripts/0a_datacleaning_clinical.R"
datacleaning-omics = "Rscript scripts/0b_datacleaning_omics.R"
datacleaning-rnaseq = "Rscript scripts/0c_datacleaning_rnaseq.R"
table1 = "Rscript scripts/1a_tableone_ffmi_1y.R"
alphadiv = "Rscript scripts/2a_mb_alphadiversity_ffmi_1y.R"
betadiv = "Rscript scripts/2b_mb_betadiversity_ffmi_1y.R"
composition = "Rscript scripts/2c_mb_composition_ffmi_1y.R"
ml-prep = "Rscript scripts/3a_ml_prep.R"
ml-run = "bash scripts/3b_ml_run.sh"
ml-process = "Rscript scripts/3c_ml_process.R"
humann = "Rscript scripts/4a_humann_pathways.R"
mb-metabolome = "Rscript scripts/4b_mb_metabolome_correlations.R"
mb-diet = "Rscript scripts/4c_mb_diet_correlations.R"
liver-rnaseq = "Rscript scripts/5a_liver_rnaseq.R"

[tasks.datacleaning]
depends-on = ["datacleaning-clinical", "datacleaning-omics", "datacleaning-rnaseq"]
description = "Clean clinical data, then omics data (microbiome, pathway, metabolomics) and RNA-seq."

[tasks.mb]
depends-on = ["alphadiv", "betadiv", "composition"]
description = "Baseline microbiome descriptive analyses (alpha diversity, beta diversity, composition), stratified by 1-year %FFMI change group."

[tasks.ml]
depends-on = ["ml-prep", "ml-run", "ml-process"]
description = "ML pipeline: prep XGBeast input data, submit model-fitting job, process results (includes explained-variance violin plots)."

[tasks.mb-correlations]
depends-on = ["humann", "mb-metabolome", "mb-diet"]
description = "Top-15 species correlations against HUMAnN pathways, metabolome, and diet macronutrients."

[tasks.all]
depends-on = ["datacleaning", "table1", "mb", "ml-prep", "ml-process", "mb-correlations"]
description = "Full pipeline except ml-run (submit the XGBeast job separately, then run ml-process). Excludes liver-rnaseq, which is still in progress."

[dependencies]
r-tidyverse = ">=2.0.0,<3"
r-ggpubr = ">=1.0.0,<2"
r-base = ">=4.5.3,<4.6"
bioconductor-phyloseq = ">=1.54.0,<2"
r-tableone = ">=0.13.2,<0.14"
r-vegan = ">=2.7_5,<3"
r-patchwork = ">=1.3.2,<2"
r-ggthemes = ">=5.2.0,<6"
grid = ">=1.3,<2"
r-metbrewer = ">=0.2.0,<0.3"
bioconductor-complexheatmap = ">=2.24.0,<3"
r-circlize = ">=0.4.16,<0.5"
python = ">=3.14.7,<3.15"
xgboost = ">=3.4.1,<4"
numpy = ">=2.5.2,<3"
pandas = ">=3.0.5,<4"
scikit-learn = ">=1.9.0,<2"
matplotlib-base = ">=3.11.1,<4"
tqdm = ">=4.70.0,<5"
seaborn = ">=0.13.2,<0.14"
shap = ">=0.52.0,<0.53"
psutil = ">=7.2.2,<8"
"r-broom.mixed" = ">=0.2.9.7,<0.3"
r-lmertest = ">=3.2_1,<4"
r-gt = ">=1.3.0,<2"
r-remotes = ">=2.5.0,<3"
r-ape = ">=5.8_1,<6"
r-ggsci = ">=5.2.0,<6"
